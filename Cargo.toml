[package]
name = "ideae"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/scillarium/ideae"
license = "MPL-2.0"

[workspace]
members = [".", "core"]
default-members = [".", "core"]

[dependencies]
ideae-core = { path = "core" }
similar = "2.7.0"
sqlformat = { version = "0.5", default-features = false }
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.22"
flate2 = "1"
gpui-cn = { version = "0.9.0", features = ["ghostty", "jetbrains-mono"] }
# The pty and its shell's setup without a window: what the daemon runs.
cn-pty = { path = "vendor/cn-pty" }
gpui-kit = { version = "0.8.1", features = ["tree-sitter-languages"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "raster-images"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
lsp-types = { version = "0.97", features = ["proposed"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
notify = "8"
# Sync APIs, one thread a session (src/db).
postgres = "0.19"
postgres_rustls = "0.1"
redis = { version = "1", default-features = false, features = ["tls-rustls", "tls-rustls-insecure", "tls-rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Trackers' APIs (src/integrations/http.rs): already in the tree, on its rustls.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "brotli", "cookies"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
boa_engine = "0.22"
# Already in the tree (rustls): seals the agents' keys (src/secrets.rs).
ring = "0.17"
tar = { version = "0.4", default-features = false }
toml = "0.8"
toml_edit = "0.22"
tree-sitter = "0.26"
tree-sitter-batch = "0.11"
tree-sitter-c = "0.24"
tree-sitter-containerfile = "0.9"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.3.0"
tree-sitter-elm = "5.9.4"
tree-sitter-erlang = "0.21.0"
tree-sitter-fish = "3.6.0"
tree-sitter-gleam = "1.0.0"
tree-sitter-glsl = "0.2.0"
tree-sitter-groovy = "0.1"
tree-sitter-hcl = "1.1"
tree-sitter-haskell = "0.24.1"
tree-sitter-ini = "1.4"
tree-sitter-julia = "0.23.1"
tree-sitter-language = "0.1"
tree-sitter-less = "1.0.0"
tree-sitter-nginx = "1"
tree-sitter-nix = "0.3.0"
tree-sitter-ocaml = "0.26.0"
tree-sitter-powershell = "0.26"
tree-sitter-prisma = "0.2.2"
tree-sitter-properties = "0.3"
tree-sitter-r = "1.3.0"
tree-sitter-solidity = "1.2.13"
tree-sitter-xml = "0.7"
tungstenite = "0.30"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rusty-leveldb = "4.0.2"


[target.'cfg(target_os = "linux")'.dependencies]
# The keyring directly: the window library names every item alike (src/db/password.rs).
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar's items are told their state when a menu opens (vendored, see [patch]).
gpui-fast-macos = "0.1.12"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSWindow", "NSPanel"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSData", "NSUserDefaults", "NSValue", "NSBundle", "NSError"] }
# Notifications as the app's own: a click on one comes back to it.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# GPUI and libghostty are unusably slow unoptimized; our own crate stays debug for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# window_border.rs patched: no 20px client-side shadow inset (see the file).
# diff/mod.rs patched: Diff::code_font_size, a per-view code size for zoom.
# diff/mod.rs + state.rs patched: room past the last file; scroll_to_file puts a header a third down.
# diff/mod.rs patched: the header of the file under the top edge sticks there.
# highlighter/languages.rs + registry.rs patched: Swift, C#, CMake, Proto, GraphQL get highlights;
# capture names of older queries (@conditional, @field…) take the colors themes define.
# highlighter/text_folds.rs + input_adapter.rs: folds of region markers and runs of comments in any
# language, of the indentation where no grammar reads the file; the markers named for the structure.
# root.rs + lib.rs patched: dialogs_watch, whether a dialog is up, told while the window
# dispatches an action and cannot be entered (the menu bar's keys go on to its fields).
# root.rs + lib.rs patched: WindowFontFeatures, font features for the whole window, dialogs too.
# menu/app_menu_bar.rs patched: menus asked of a source as each opens, behind a ☰ while
# collapsed, the title bar's size. title_bar.rs patched: its row shrinks in a narrow window.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# terminal/core.rs + engine.rs patched: report light/dark (CSI ? 996 n, mode 2031).
# terminal/appearance.rs patched: with_cell_width_adjust, a cell's width as a fraction of the font's.
gpui-cn = { path = "vendor/gpui-cn" }
# input/base/state.rs patched: hover/Ctrl+click hit-test ignored the scroll offset.
# input/base/state.rs + element.rs + editor/lsp/definitions.rs patched: jump_to_position,
# a jump lands a third down the viewport unless already in view.
# input/base/gutter.rs (new) + state.rs + element.rs + layout.rs patched: notes left of the
# line numbers (blame) with hover and click, and bookmarked lines that follow edits.
# input/base/state.rs patched: Search and Replace handlers only on a searchable input, so the
# menu bar's Find items are grey in a plain field.
gpui-base = { path = "vendor/gpui-base" }
# wayland/window.rs patched: the first commit waits for maximize/fullscreen, so a
# window opened maximized is placed by the compositor and restores to that place.
gpui-fast-linux = { path = "vendor/gpui-fast-linux" }
# platform.rs patched: set_menus listed every item's action again on each call and never
# dropped the old ones; an action already listed now keeps its tag. set_menu_hooks: the app
# tells each item's state, title and check mark when its menu opens (menuNeedsUpdate,
# validateMenuItem), so the menus are made once, not again whenever what they show changes.
gpui-fast-macos = { path = "vendor/gpui-fast-macos" }
# layout/flowchart/manual_layout.rs patched: a rank's nodes start side by side in its order, not
# sorted by their width, which tore subgraphs of unconnected nodes apart (overlapping groups,
# and a panic of its debug_assert! in a debug build).
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }

[build-dependencies]
cc = "1"
embed-resource = "3.0.12"

[profile.release]
# The names of functions stay: a crash is told with them (crash.rs).
strip = "debuginfo"
