name: Release

# A push to main whose CI passed on every system is a release, tagged with
# its UTC time (yyyymmddhhmmss), with a binary for each supported system.
# CI cancels a run when a newer push comes, so a burst of pushes makes one
# release, of the last one. By hand (workflow_dispatch) it skips CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Releases queue up rather than cancel each other: each push gets its own.
concurrency:
  group: release
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      IDEAE_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          # Its own cache is one more per run, never read again: ghostty's build
          # is in Rust's cache already, with its build script's output.
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          # Read, never written: a release after every push to main saved some 4 GB
          # of its own, and the repository's 10 GB pushed CI's caches out.
          save-if: false
      # Against glibc 2.31, so it runs on older distributions too (see docs/building.md).
      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-Wl,--allow-shlib-undefined
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.31
      - name: Package
        run: cp target/x86_64-unknown-linux-gnu/release/ideae "ideae-$IDEAE_VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ideae-*-linux-x86_64

  windows:
    needs: version
    runs-on: windows-latest
    env:
      IDEAE_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: false
      # gpui compiles its HLSL shaders with the Windows SDK's fxc.exe.
      - name: Find fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: Copy-Item target/release/ideae.exe "ideae-$env:IDEAE_VERSION-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ideae-*-windows-x86_64.exe

  # Apple Silicon and Intel, both built on Apple Silicon. The bare binary is
  # what updates download; the .app in a zip is for a first install. Ad-hoc
  # signed only (no Developer ID yet): the first start needs right click, Open.
  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      # One that fails leaves the other to be released.
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    env:
      IDEAE_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
          save-if: false
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Server
        run: |
          cargo build -p ideae-core --bin ideae-server --release --locked --target ${{ matrix.target }}
          arch=${{ matrix.arch }}
          [ "$arch" = arm64 ] && arch=aarch64
          cp "target/${{ matrix.target }}/release/ideae-server" "ideae-server-$IDEAE_VERSION-$arch-macos"
          codesign --force --sign - "ideae-server-$IDEAE_VERSION-$arch-macos"
      - name: Package
        run: |
          bin="ideae-$IDEAE_VERSION-macos-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/ideae" "$bin"
          codesign --force --sign - "$bin"
          scripts/macos-app.sh "$bin" ideae.app "$IDEAE_VERSION"
          ditto -c -k --keepParent ideae.app "$bin.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ideae-*-macos-${{ matrix.arch }}*
            ideae-server-*

  # What a server runs for a window on another machine (src/daemon/install.rs):
  # static, so any Linux takes it, with no library of a desktop. Named
  # arch-os (x86_64-linux): releases before these take the file that ends
  # as their system's app (-linux-x86_64), and must never take a server's.
  server:
    needs: version
    runs-on: ubuntu-24.04
    env:
      IDEAE_VERSION: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-server
          save-if: false
      - name: Build
        run: |
          for arch in x86_64 aarch64; do
            cargo zigbuild -p ideae-core --bin ideae-server --release --locked --target $arch-unknown-linux-musl
            cp target/$arch-unknown-linux-musl/release/ideae-server "ideae-server-$IDEAE_VERSION-$arch-linux"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: ideae-server-*

  # A macOS build that fails leaves the others to be released.
  release:
    needs: [version, linux, windows, macos, server]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.server.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The install scripts of this commit go with its builds: the link to
      # the latest release's install.sh is the one to give out.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: |
            scripts/install.sh
            scripts/install.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # GitHub refuses this token a tag on a commit whose workflows are
          # not those of main (as for a change to them). main has moved on
          # then, and the newer commit makes its own release.
          moved=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" \
            --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | length')
          if [ "$moved" != 0 ]; then
            echo "::notice::Not released: main changed the workflows since $SHA; a newer commit will be."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$TAG" --generate-notes ideae-* scripts/install.sh scripts/install.ps1
