name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lines in a failing test's backtrace, no more: full debug info made the
# build slower and its cache several GB, and the repository keeps 10 GB of
# caches in all, so they pushed each other out.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          # Its own cache is one more per run, never read again: ghostty's build
          # is in Rust's cache already, with its build script's output.
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Our own crates too: vendor/'s are built optimized, minutes each
          # (gpui-component, gpui-base…); ideae's own go before it is saved.
          # Cargo tells a local crate fresh by its files' times, which a checkout
          # makes new: those of a crate that holds what was built are made old
          # (scripts/vendor-times.py, its record kept in .vendor-built).
          cache-workspace-crates: true
          cache-directories: .vendor-built
          # New with vendor/ in it: the cache of before would be taken as a
          # match and none saved.
          prefix-key: v1-rust
          # A pull request's cache is its own alone and would push main's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: vendor/'s crates as old as their builds in the cache
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/vendor-times.py old .vendor-built
      # cargo test builds it again for the tests: this only sees that the rest compiles.
      # What each build used goes to used-*.json, for what the cache keeps.
      - run: cargo check --locked --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-check.json"
        shell: bash
      - run: cargo test --locked --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-test.json"
        shell: bash
      - run: cargo test --locked
      - run: scripts/string-slices.sh
      # The cache saved after the job takes target/ whole: what an older one
      # held and this run built again goes first (scripts/prune-target.py).
      - name: Keep only what was used
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/vendor-times.py record .vendor-built
          "$python" scripts/prune-target.py --drop ideae,ideae-core ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }} "$RUNNER_TEMP"/used-*.json

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # As in build.
          cache-workspace-crates: true
          cache-directories: .vendor-built
          prefix-key: v1-rust
          # A pull request's cache is its own alone and would push main's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: vendor/'s crates as old as their builds in the cache
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/vendor-times.py old .vendor-built
      # cargo test builds it again for the tests: this only sees that the rest compiles.
      # What each build used goes to used-*.json, for what the cache keeps.
      - run: cargo check --locked --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-check.json"
        shell: bash
      - run: cargo test --locked --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-test.json"
        shell: bash
      - run: cargo test --locked
      - name: Keep only what was used
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/vendor-times.py record .vendor-built
          "$python" scripts/prune-target.py --drop ideae,ideae-core ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }} "$RUNNER_TEMP"/used-*.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # As in build.
          cache-workspace-crates: true
          cache-directories: .vendor-built
          prefix-key: v1-rust
          # A pull request's cache is its own alone and would push main's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: vendor/'s crates as old as their builds in the cache
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/vendor-times.py old .vendor-built
      # cargo test builds it again for the tests: this only sees that the rest compiles.
      # What each build used goes to used-*.json, for what the cache keeps.
      - run: cargo check --locked --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-check.json"
        shell: bash
      - run: cargo test --locked --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-test.json"
        shell: bash
      - run: cargo test --locked
      - name: Keep only what was used
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/vendor-times.py record .vendor-built
          "$python" scripts/prune-target.py --drop ideae,ideae-core ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }} "$RUNNER_TEMP"/used-*.json
