name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lines in a failing test's backtrace, no more: full debug info made the
# build slower and its cache several GB, and the repository keeps 10 GB of
# caches in all, so they pushed each other out.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
          # Its own cache is one more per run, never read again: ghostty's build
          # is in Rust's cache already, with its build script's output.
          use-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A pull request's cache is its own alone and would push main's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo test builds it again for the tests: this only sees that the rest compiles.
      # What each build used goes to used-*.json, for what the cache keeps.
      - run: cargo check --locked --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-check.json"
        shell: bash
      - run: cargo test --locked --no-run --timings --message-format=json-render-diagnostics > "$RUNNER_TEMP/used-test.json"
        shell: bash
      - run: cargo test --locked
      - run: scripts/string-slices.sh
      # The cache saved after the job takes target/ whole: what an older one
      # held and this run built again goes first (scripts/prune-target.py).
      - name: Keep only what was used
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/prune-target.py ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }} "$RUNNER_TEMP"/used-*.json
      # TRIAL, not for main: where the build's time and the cache's size go.
      - name: What target holds
        shell: bash
        run: |
          du -sh target/debug/* 2>/dev/null | sort -h | tail -8
          echo "--- largest units"
          du -sk target/debug/build/*/* 2>/dev/null | sort -n | tail -15 | awk '{printf "%6d MB %s\n", $1/1024, $2}'
          echo "--- by kind"
          for ext in rlib rmeta a so dylib dll lib o; do printf "%-6s " $ext; find target/debug -name "*.$ext" -type f -print0 2>/dev/null | xargs -0 du -ck 2>/dev/null | tail -1 | awk '{printf "%d MB\n", $1/1024}'; done
      - uses: actions/upload-artifact@v4
        with:
          name: timings-${{ github.job }}
          path: target/cargo-timings/cargo-timing.html

